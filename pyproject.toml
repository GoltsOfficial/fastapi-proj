[project]
name = "fastapi-proj"
version = "0.1.0"
description = "Сервис сокращения ссылок"
authors = [
    {name = "Pavel Chernous",email = "goltshteyngottorp@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.140.0,<0.141.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)"
]

[tool.poetry]
packages = [{include = "fastapi_proj", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.1,<5.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)"
]
test = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[project.scripts]
app = "src.lkeep.main:app"